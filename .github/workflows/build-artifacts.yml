name: Build Artifacts

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sheet-updated]

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build search index and entity graph
        env:
          NEXT_PUBLIC_SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: npm run build:artifacts -- --skip-istep

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No artifact changes"
          else
            git commit -m "chore: update search index and entity graph artifacts"
            git push
          fi

      - name: Revalidate production cache
        if: ${{ secrets.REVALIDATE_URL != '' && secrets.REVALIDATE_SECRET != '' }}
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -sS -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","tags":["posts"]}'
